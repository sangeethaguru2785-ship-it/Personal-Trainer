<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <!-- Left Panel - Branding -->
        <div class="auth-left">
            <div class="auth-left-overlay"></div>
            <div class="auth-left-content">
                <a href="index.html" class="auth-logo">
                    <img src="img/logo-red.webp" alt="Stackly" class="brand-logo" style="height:48px;">
                </a>
                <h1 class="auth-left-title">Join <span class="text-gradient">Stackly</span> Today</h1>
                <p class="auth-left-text">Create your account and start transforming your body with expert guidance and personalized programs.</p>
                <div class="auth-left-stats">
                    <div class="auth-stat">
                        <span class="auth-stat-number">5,000+</span>
                        <span class="auth-stat-label">Members</span>
                    </div>
                    <div class="auth-stat">
                        <span class="auth-stat-number">50+</span>
                        <span class="auth-stat-label">Trainers</span>
                    </div>
                    <div class="auth-stat">
                        <span class="auth-stat-number">98%</span>
                        <span class="auth-stat-label">Satisfaction</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Sign Up Form -->
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="auth-form-header" id="authHeader">
                    <h2>Create Account</h2>
                    <p>Join our fitness community today</p>
                </div>

                <!-- Role Toggle -->
                <div class="auth-role-toggle" id="roleToggle">
                    <button class="auth-role-btn active" data-role="member">
                        <i class="fas fa-user"></i>
                        <span>Member</span>
                    </button>
                    <button class="auth-role-btn" data-role="trainer">
                        <i class="fas fa-user-tie"></i>
                        <span>Trainer</span>
                    </button>
                </div>

                <!-- Sign Up Form -->
                <form class="auth-form" id="signupForm" novalidate>
                    <input type="hidden" id="signupRole" value="member">

                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="auth-form-group" id="signupFirstNameGroup">
                                <label for="signupFirstName">First Name</label>
                                <div class="auth-input-wrapper">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="signupFirstName" placeholder="First name" required>
                                    <span class="auth-input-status"></span>
                                </div>
                                <span class="auth-error" id="signupFirstNameError"></span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="auth-form-group" id="signupLastNameGroup">
                                <label for="signupLastName">Last Name</label>
                                <div class="auth-input-wrapper">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="signupLastName" placeholder="Last name" required>
                                    <span class="auth-input-status"></span>
                                </div>
                                <span class="auth-error" id="signupLastNameError"></span>
                            </div>
                        </div>
                    </div>

                    <div class="auth-form-group" id="signupEmailGroup">
                        <label for="signupEmail">Email Address</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="signupEmail" placeholder="Enter your email" required>
                            <span class="auth-input-status"></span>
                        </div>
                        <span class="auth-error" id="signupEmailError"></span>
                    </div>

                    <div class="auth-form-group" id="signupPasswordGroup">
                        <label for="signupPassword">Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signupPassword" placeholder="Create a password" required>
                            <button type="button" class="auth-toggle-pass" data-target="signupPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="auth-input-status"></span>
                        </div>
                        <div class="auth-pass-strength" id="passStrength">
                            <div class="auth-pass-bar"><div class="auth-pass-fill" id="passFill"></div></div>
                            <span class="auth-pass-text" id="passText"></span>
                        </div>
                        <span class="auth-error" id="signupPasswordError"></span>
                    </div>

                    <div class="auth-form-group" id="signupConfirmGroup">
                        <label for="signupConfirm">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signupConfirm" placeholder="Confirm your password" required>
                            <button type="button" class="auth-toggle-pass" data-target="signupConfirm">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="auth-input-status"></span>
                        </div>
                        <span class="auth-error" id="signupConfirmError"></span>
                    </div>

                    <div class="auth-form-group" id="signupPhoneGroup">
                        <label for="signupPhone">Phone Number <span class="text-muted">(optional)</span></label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="signupPhone" placeholder="+1 (555) 123-4567">
                        </div>
                    </div>

                    <div class="auth-form-check">
                        <label class="auth-checkbox">
                            <input type="checkbox" id="agreeTerms" required>
                            <span class="auth-checkbox-mark"></span>
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                        <span class="auth-error" id="agreeTermsError"></span>
                    </div>

                    <button type="submit" class="btn btn-accent auth-submit-btn">
                        <span class="auth-btn-text">Create Account</span>
                        <span class="auth-btn-loader" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or sign up with</span>
                </div>

                <div class="auth-social-btns">
                    <button class="auth-social-btn">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="auth-social-btn">
                        <i class="fab fa-apple"></i>
                        <span>Apple</span>
                    </button>
                </div>

                <p class="auth-switch">
                    Already have an account? <a href="login.html">Sign In</a>
                </p>

                <a href="index.html" class="auth-back-home">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
